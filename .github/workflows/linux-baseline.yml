name: Pinned Linux baseline
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m py_compile scripts/*.py
  native-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Acquire and verify immutable upstream source (read only)
        run: python3 scripts/baseline.py source
      - name: Install reviewed Linux build and software-rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ libasound2-dev libfontconfig-dev libgit2-dev libglib2.0-dev libssl-dev libva-dev libvulkan1 libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev make cmake clang lld llvm jq gettext-base elfutils libsqlite3-dev musl-tools musl-dev libstdc++-14-dev pipewire xdg-desktop-portal xvfb xauth xdotool x11-xserver-utils x11-utils imagemagick mesa-vulkan-drivers vulkan-tools openbox xcompmgr tesseract-ocr
          rustup toolchain install 1.98.1 --profile minimal
      - name: Build unchanged pinned editor within declared resource bounds
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: python3 scripts/baseline.py build --jobs 2 --timeout-seconds 5400
      - name: Native file-open, edit and save under software X11
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GPUI_X11_SCALE_FACTOR: '1'
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/managed_x11_smoke.sh
      - name: Preserve evidence, never publish an editor binary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pinned-linux-baseline-${{ github.sha }}
          path: |
            upstream.lock.json
            _build/baseline/build.json
            _build/baseline/cargo.log
            _build/smoke/smoke.json
            _build/smoke/editor.log
            _build/smoke/data/logs/Zed.log
            _build/smoke/data/logs/Zed.log.old
            _build/smoke/editor.png
            _build/smoke/startup-modal.png
            _build/smoke/before-input.png
            _build/smoke/after-input.png
            _build/openbox.log
            _build/xcompmgr.log
            _build/smoke/mzed-baseline-fixture.txt
          retention-days: 14
